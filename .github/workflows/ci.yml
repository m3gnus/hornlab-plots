name: CI

on:
  push:
    branches: [main, "lander/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run the complete installed package suite
        shell: bash
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import sysconfig
          import tempfile
          import xml.etree.ElementTree as ET
          import hornlab_plots

          origin = Path(hornlab_plots.__file__).resolve()
          site_packages = Path(sysconfig.get_path("purelib")).resolve()
          assert origin.is_relative_to(site_packages), origin
          print(f"Installed package: {origin}", flush=True)
          with tempfile.TemporaryDirectory(prefix="plots-ci-") as temporary:
              root = Path(temporary)
              shutil.copytree("tests", root / "tests")
              report = root / "pytest.xml"
              subprocess.run(
                  [sys.executable, "-I", "-m", "pytest", "tests", "-q",
                   "-o", "pythonpath=", "-o", "addopts=",
                   "--junitxml", str(report)], cwd=root, check=True,
              )
              cases = list(ET.parse(report).getroot().iter("testcase"))
              assert cases, "No tests collected"
              for case in cases:
                  for outcome in ("failure", "error", "skipped"):
                      assert case.find(outcome) is None, (
                          case.get("classname"), case.get("name"), outcome
                      )
              print(f"Installed suite: {len(cases)} passed; zero skips", flush=True)
          PY
